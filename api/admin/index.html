<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1A1E" media="(prefers-color-scheme: dark)">
<title>Panel de All In One</title>
<link rel="icon" href="assets/icon-teal.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/poppins-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="panel.css">
</head>
<body data-screen="loading">
<a class="skip" href="#app">Ir al contenido</a>
<header class="top">
  <img class="logo" src="assets/icon-teal.png" alt="" width="34" height="39">
  <span class="brand">Panel de All In One</span>
  <button id="signout" class="btn btn-secondary btn-small" type="button" hidden>Salir</button>
</header>
<main id="app" tabindex="-1"><p class="loading">Un momento, por favor…</p></main>
<div id="bar" class="bar" hidden>
  <p id="bar-hint" class="bar-hint"></p>
  <button id="bar-publish" class="btn btn-primary btn-big" type="button">Publicar cambios</button>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="dialog-root"></div>
<div id="fx-root" aria-hidden="true"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<noscript><p class="msg msg-error">Este panel necesita JavaScript. Use el navegador del teléfono (Safari).</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
